name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_ENABLE_DEMO_DATA: "false"
      EXPO_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:ci
      - run: npm run check
      - run: npx expo-doctor
      - run: npm run export:android
      - run: npm run export:web

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: supabase/setup-cli@f1f5dafb77e59332c5c8ba46e8c068d56ed4e4eb  # v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
